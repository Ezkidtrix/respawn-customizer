name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: actions/checkout@v7

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Get mod version
        id: mod_info
        run: |
          MOD_JSON=$(find . -maxdepth 3 -name "mod.json" | head -n 1)
          GEODE_FILE=$(find . -maxdepth 4 -name "*.geode" | head -n 1)
          echo "Found .geode file: $GEODE_FILE"
          echo "version=$(jq -r '.version' "$MOD_JSON")" >> $GITHUB_OUTPUT
          echo "geode_file=$GEODE_FILE" >> $GITHUB_OUTPUT
          {
            echo 'message<<EOF'
            git log -1 --pretty=%B
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Upload to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.mod_info.outputs.version }}
          name: ${{ steps.mod_info.outputs.version }}
          body: ${{ steps.mod_info.outputs.message }}
          files: ${{ steps.build.outputs.build-output }}/*.geode
          fail_on_unmatched_files: true